{% extends 'base.html' %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h2 class="mb-4 text-center text-white">📝 {{ quiz.title }}</h2>
            <div class="card shadow"
                style="background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1);">
                <div class="card-body text-white">
                    <form method="post">
                        {% csrf_token %}

                        {% for q in questions %}
                        <div class="mb-4 p-3 rounded"
                            style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);">
                            <h5>{{ forloop.counter }}. {{ q.text }}</h5>

                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="question_{{ q.id }}"
                                    id="q{{ q.id }}_opt1" value="1" required>
                                <label class="form-check-label" for="q{{ q.id }}_opt1">{{ q.option1 }}</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="question_{{ q.id }}"
                                    id="q{{ q.id }}_opt2" value="2" required>
                                <label class="form-check-label" for="q{{ q.id }}_opt2">{{ q.option2 }}</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="question_{{ q.id }}"
                                    id="q{{ q.id }}_opt3" value="3" required>
                                <label class="form-check-label" for="q{{ q.id }}_opt3">{{ q.option3 }}</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="question_{{ q.id }}"
                                    id="q{{ q.id }}_opt4" value="4" required>
                                <label class="form-check-label" for="q{{ q.id }}_opt4">{{ q.option4 }}</label>
                            </div>
                        </div>
                        {% endfor %}

                        <div class="text-center">
                            <button type="submit" class="btn btn-primary btn-lg px-5">Submit Quiz</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
