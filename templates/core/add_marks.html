{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow"
            style="background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1);">
            <div class="card-header border-bottom border-light text-white" style="background: rgba(0, 0, 0, 0.2);">
                <h4>Add Marks</h4>
            </div>
            <div class="card-body">
                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="text-white">Department / Branch</label>
                        <select name="department" class="form-control" required>
                            <option value="">Select Department/Branch</option>
                            <option value="cs">CS</option>
                            <option value="cse">C.SE / CSE</option>
                            <option value="ece">ECE</option>
                            <option value="ee">EE</option>
                            <option value="me">ME</option>
                            <option value="ce">CE</option>
                            <option value="it">IT</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="text-white">Semester</label>
                        <select name="semester" class="form-control" required>
                            <option value="">Select Semester</option>
                            <option value="1st Semester">1st Semester</option>
                            <option value="2nd Semester">2nd Semester</option>
                            <option value="3rd Semester">3rd Semester</option>
                            <option value="4th Semester">4th Semester</option>
                            <option value="5th Semester">5th Semester</option>
                            <option value="6th Semester">6th Semester</option>
                            <option value="7th Semester">7th Semester</option>
                            <option value="8th Semester">8th Semester</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="text-white">Target Course / Class</label>
                        <select name="course" class="form-control" required>
                            <option value="">Select Course</option>
                            <option value="btech">B.Tech</option>
                            <option value="bsc">B.Sc</option>
                            <option value="bca">BCA</option>
                            <option value="mtech">M.Tech</option>
                            <option value="mca">MCA</option>
                            <option value="mba">MBA</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="text-white">Subject</label>
                        <input type="text" name="subject" class="form-control" placeholder="e.g. Mathematics" required>
                    </div>
                    <div class="mb-3">
                        <label class="text-white">Total Marks</label>
                        <input type="number" name="total_marks" class="form-control" placeholder="e.g. 100" required>
                    </div>
                    <div class="mb-3">
                        <label class="text-white">Exam Type</label>
                        <select name="exam_type" class="form-control">
                            <option value="Mid Term">Mid Term</option>
                            <option value="Final">Final</option>
                            <option value="Assignment">Assignment</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Process Next Step</button>
                    <a href="{% url 'teacher_dashboard' %}" class="btn btn-secondary">Back</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
