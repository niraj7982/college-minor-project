{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow"
            style="background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1);">
            <div class="card-header border-bottom border-light text-white" style="background: rgba(0, 0, 0, 0.2);">
                <h4>Take Attendance</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="text-white">Course / Class</label>
                        <input type="text" name="course" class="form-control" placeholder="e.g. B.Tech CS 2nd Year"
                            required>
                    </div>
                    <div class="mb-3">
                        <label class="text-white">Subject</label>
                        <input type="text" name="subject" class="form-control" placeholder="e.g. Data Structures"
                            required>
                    </div>
                    <button type="submit" class="btn btn-primary">Next</button>
                    <a href="{% url 'teacher_dashboard' %}" class="btn btn-secondary">Back</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
