{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow"
            style="background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1);">
            <div class="card-header border-bottom border-light text-white" style="background: rgba(0, 0, 0, 0.2);">
                <h4>Submit Feedback</h4>
            </div>
            <div class="card-body">
                <p class="text-white">We value your suggestions! Please let us know how we can improve.</p>
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3">
                        {{ field }}
                    </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-info w-100 text-white">Send Feedback</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
