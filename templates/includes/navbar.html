<!-- 
=========================================================
  BEGINNER FRIENDLY HTML: THE NAVBAR (Navigation Bar)
=========================================================
By putting the Navbar in its own separate file, we keep our 
main "base.html" file small and easy to read. 
If we want to add a new link to the menu later, we only 
need to change this one single file!
-->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <!-- Brand/Logo Link -->
        <a class="navbar-brand fw-bold" href="#">Digital Campus</a>

        <!-- Toggle button for mobile devices (the 'hamburger' menu) -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- The actual menu links are inside this div -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <!-- Links on the LEFT side of the menu -->
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'about' %}">About</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'contact' %}">Contact</a>
                </li>
            </ul>

            <!-- Links on the RIGHT side of the menu -->
            <ul class="navbar-nav ms-auto">
                <!-- Check if the user is already logged in -->
                {% if user.is_authenticated %}
                <li class="nav-item">
                    <a class="nav-link text-white" href="{% url 'chatbot' %}">AI Assistant</a>
                </li>
                <li class="nav-item">
                    <!-- Display personal welcome message -->
                    <span class="nav-link text-white">Hello, {{ user.username }} ({{ user.role }})</span>
                </li>
                <li class="nav-item">
                    <!-- Logout button -->
                    <a class="nav-link text-white" href="{% url 'logout' %}">Logout</a>
                </li>
                {% else %}
                <!-- If the user is NOT logged in, show Login and Signup -->
                <li class="nav-item">
                    <a class="nav-link text-white" href="{% url 'login' %}">Login</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="{% url 'signup' %}">Sign Up</a>
                </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>
